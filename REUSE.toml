version = 1
SPDX-PackageName = "uml4net"
SPDX-PackageSupplier = "Starion Group S.A."
SPDX-PackageDownloadLocation = "https://github.com/STARIONGROUP/uml4net"

# Default for every file that carries no SPDX header of its own: test data, images, project,
# solution and settings files, templates, documentation. Files with their own SPDX header
# (all .cs files) keep it ("closest").
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2019-2026 Starion Group S.A."
SPDX-License-Identifier = "Apache-2.0"

# The ReSharper file header template contains SPDX tags with XML-escaped line endings (&#xD;),
# which must not be read as this file's own license information.
[[annotations]]
path = "uml4net.sln.DotSettings"
precedence = "override"
SPDX-FileCopyrightText = "2019-2026 Starion Group S.A."
SPDX-License-Identifier = "Apache-2.0"

# ------------------------------------------------------------------------------------------------
# Third-party material. These files carry no license notice of their own and their redistribution
# terms have not been confirmed yet (see #530), so they are labelled with a LicenseRef-*Unconfirmed
# license (text in LICENSES/) that says exactly that. Never relabel them as
# Starion Group S.A. / Apache-2.0.
# ------------------------------------------------------------------------------------------------

# OMG specification metamodels, profiles and schemas (machine-readable files published with the
# OMG specifications), including the copy of UML.xmi embedded in uml4net.xmi and the SysML model
# with an added unknown element used by the tests.
[[annotations]]
path = [
    "resources/AEP/**",
    "resources/AML/**",
    "resources/API4KP/**",
    "resources/ATDM/**",
    "resources/BACM/**",
    "resources/DD/**",
    "resources/DDSI-RTPS/**",
    "resources/Decision Model and Notation/**",
    "resources/SySML1.7/**",
    "resources/SySML2/**",
    "resources/UML/**",
    "resources/UML_with_unknown_element/**",
    "resources/XMI/XMI.xsd",
    "resources/XMI/XMI-model.xmi",
    "uml4net.xmi/Resources/UML.xmi",
]
precedence = "override"
SPDX-FileCopyrightText = "Object Management Group, Inc."
SPDX-License-Identifier = "LicenseRef-OMG-Unconfirmed"

# MagicDraw standard profiles exported with the MagicDraw (Cameo) sample models.
[[annotations]]
path = "resources/MagicDrawModels/eclipse/*.profile.uml"
precedence = "override"
SPDX-FileCopyrightText = "No Magic, Inc. (Dassault Systèmes)"
SPDX-License-Identifier = "LicenseRef-Unconfirmed"

# MagicDraw (Cameo) sample models of unknown origin.
[[annotations]]
path = [
    "resources/MagicDrawModels/*.xml",
    "resources/MagicDrawModels/*.uml",
    "resources/MagicDrawModels/eclipse/BallotDefinition_UML_Model.uml",
]
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "LicenseRef-Unconfirmed"

# XMI 1.0 DTD ("Generated by: XMI Framework 1.0", 1999) used by Enterprise Architect.
[[annotations]]
path = "resources/Enterprise Architect Extensions/UML_EA.DTD"
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "LicenseRef-Unconfirmed"
